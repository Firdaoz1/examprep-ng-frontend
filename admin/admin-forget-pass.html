<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPrep NG-Forget Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/script.js" defer></script>
  <script src="./student-authentication.js" defer></script>
</head>


<body class="bg-[#181818] font-['Inter']">
  <main class="w-full max-w-[1280px] m-auto bg-white md:h-[calc(100vh-32px)] lg:my-4">

    <section class="bg-[#085848] text-[#FFFFFF] p-10 md:px-12 lg:p-14 flex flex-col justify-between">
      
      <div class="flex items-center gap-2">
        <img src="/Images/logo.png" alt="logo">
        <p class="text-[22px] font-extrabold">ExamPrep NG</p>
      </div>
    </section>
    
    <section class="px-6 py-5 flex items-center">

      <div class="w-full max-w-[500px] mx-auto">
          <h2 class=" flex items-center gap-2 text-[22px] md:text-[32px] font-bold text-[#085848] mt-6 mb-10">Change Password</h2>

      <div>
        <form id="forget-password-form" class="space-y-5">

          <!-- new password -->

           <p id="message" class="text-[12px] text-red-500"></p>

          <p class="text-[16px] font-bold text-[#78909C]">Enter your new password</p>
          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">

            <img src="/Images/Password.png" alt="Password-icon" class="w-5 h-5 shrink-0">

            <input id="new-password" type="password" placeholder="New password" class="flex-1 border-none outline-none bg-transparent text-[14px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold">

            <button type="button" class="toggle-password flex items-center justify-center shrink-0">

              <ion-icon name="eye-off-outline" class="toggle-password text-2xl text-[#085848]"></ion-icon>
            </button>
          </div>

           <!--Confirm Password -->
           <p class="text-[16px] font-bold text-[#78909C]">Re-enter your new password</p>

          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">

            <img src="/Images/Password.png" alt="Password-icon" class="w-5 h-5 shrink-0">

            <input id="confirm-new-password" type="password" placeholder="Confirm new password" class="flex-1 border-none outline-none bg-transparent text-[14px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold">

            <button type="button" class="toggle-password w-7 h-7 flex items-center justify-center shrink-0">

              <ion-icon name="eye-off-outline" class="toggle-password text-2xl text-[#085848]"></ion-icon>
            </button>
          </div>

           <p id="password-message" class="text-[12px] text-red-500"></p>

          <button type="submit" class="w-full p-4 mt-5 bg-[#085848] rounded-[9px] text-[#FFFFFF] text-[14px] font-bold flex items-center justify-center gap-3">Change Password <ion-icon name="arrow-forward-outline"></ion-icon>
          </button>
        </form>
        </div>
        <p class="text-[12px] md:text-[14px] font-bold text-[#78909C] mt-5 text-center">Back to <a href="./admin-login.html" class="text-[#085848]">Login</a> page</p>
      </div>
    </section>
      
  </main>

  <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
