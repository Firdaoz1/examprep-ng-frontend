<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamPrep NG - Landing page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-white overflow-x-hidden font-['Inter']">
    <main class="relative min-h-screen w-full overflow-hidden bg-white">
      <img
        src="/Images/Ellipse 247.png"
        alt=""
        class="absolute top-0 right-0"
      />
      <img
        src="/Images/Ellipse 248.png"
        alt=""
        class="absolute bottom-0 left-0"
      />

      <header
        class="relative z-10 w-full px-5 sm:px-8 md:px-14 lg:px-20 pt-6 sm:pt-7"
      >
        <img src="/Images/logo 2.png" alt="logo" class="w-[250px]" />
      </header>

      <section
        class="relative z-10 min-h-[calc(100vh-80px)] px-5 sm:px-8 flex flex-col items-center text-center"
      >
        <div class="mt-10 sm:mt-16 md:mt-14">
          <h1
            class="font-bold uppercase leading-[1.2] text-[34px] sm:text-[42px] md:text-[48px] lg:text-[64px]"
          >
            <span class="text-[#003028]">Prepare</span>
            <span class="text-[#085848]">Smarter.</span>
            <br />
            <span class="text-[#085848]">Perform</span>
            <span class="text-[#003028]">Better.</span>
          </h1>

          <p
            class="mt-5 sm:mt-6 max-w-[620px] mx-auto text-[#000000]/50 text-[24px] leading-[1.5] font-medium"
          >
            Practice past questions, track your performance,<br
              class="hidden sm:block"
            />
            and improve on the topics that matter<br class="hidden sm:block" />
            most all in one place.
          </p>
        </div>

        <div class="flex justify-center">
          <img src="/Images/landing.png" alt="student studying" />
        </div>

        <a
          href="/students/authentication/onbording.html"
          class="mt-7 sm:mt-8 w-full md:max-w-[400px] p-4 rounded-[11px] bg-[#085848] text-white flex items-center justify-center gap-3 text-[24px] font-bold"
        >
          <span>Get Started</span>

          <ion-icon name="arrow-forward-outline" class="text-[20px]"></ion-icon>
        </a>

        <p
          class="mt-7 sm:mt-8 pb-10 text-[#000000]/50 text-[24px] leading-7 font-medium"
        >
          Your journey to better exam preparation<br />
          starts here
        </p>
      </section>
    </main>

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
