<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPrep NG - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
   <script src="./login.js" defer></script>
</head>

<body class="bg-[#181818] font-['Inter']">

  <main class="w-full max-w-[1280px] mx-auto bg-white md:h-[calc(100vh-32px)] lg:my-4 lg:grid lg:grid-cols-2">

    <section class="bg-[#063F35] text-[#FFFFFF] px-12 pt-8 md:px-14 flex flex-col justify-between">

      
      <div class="flex items-center gap-2 lg:order-1">
        <img src="/Images/logo 4.png" alt="logo">
      </div>

      <div class="mt-7 lg:order-3">
        <h1 class="text-[32px] font-bold">Practice today,<br><span class="text-[#319F43]">Score tomorrow.</span></h1>

        <p class=" my-4 max-w-[310px] text-[15px] md:text-[16px] leading-[30px]  text-white">JAMB practice, CBT simulations and personalised learning to help you reach your goals.</p>
      </div>

      <div class="mt-12 space-y-8 lg:space-y-9 -ml-10 lg:order-2">
        <img src="/Images/Learning-cuate 1.png" alt="learning">
      </div>

    </section>

    <section class="bg-[#FFFFFF] px-6 py-12 sm:px-10 sm:py-14 md:px-14 lg:px-[68px] lg:py-0 flex items-center overflow-hidden">

      <div class="w-full max-w-[500px] mx-auto">
        <div class="mb-10">

          <p class="mt-2 text-[13px] md:text-[16px] font-bold text-[#78909C]">Log in continue your preparation.</p>

          <h2 class=" flex items-center gap-2 text-[28px] md:text-[32px] font-bold text-[#085848]">Welcome back</h2>
        </div>

        <form id="login-form" class="space-y-5">

          <p id="message" class="text-[12px] text-red-500"></p>
          

          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">

            <img src="/Images/email.png" alt="Email icon" class="w-5 h-5 shrink-0">

            <input id="email" type="text" placeholder="Email address" required class="flex-1 border-none outline-none bg-transparent text-[16px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold">
          </div>

          
          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">

            <img src="/Images/Password.png" alt="Password-icon" class="w-5 h-5 shrink-0">

            <input id="password" type="password" placeholder="Password" required class="flex-1 border-none outline-none bg-transparent text-[16px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold">

            <button type="button" class="toggle-password w-7 h-7 flex items-center justify-center shrink-0">

              <ion-icon id="eye-icon" name="eye-off-outline" class="text-2xl text-[#085848]"></ion-icon>
            </button>
          </div>

          
          <div class="flex justify-end -mt-1">

            <a href="./forget-pass.html" target="_blank" class="text-[16px] font-bold text-[#085848]">Forgot Password ?</a>
          </div>
          
        
          <button type="submit" class="w-full p-3 mt-5 bg-[#085848] rounded-[9px] text-[#FFFFFF] text-[20px] font-bold flex items-center justify-center gap-3">Log in <ion-icon name="arrow-forward-outline"></ion-icon>
          </button>
        </form>

        <div class="my-10 flex items-center gap-5">

          <div class=" h-px bg-[#78909C] flex-1"></div>
          <span class="text-[11px] font-bold text-[#78909C]"> OR</span>

          <div class="h-px bg-[#78909C]/70 flex-1"></div>
        </div>

        <button id="google-login" type="button" class=" w-full p-4 border border-[#D9D9D9] rounded-[10px] bg-[#FFFFFF] flex items-center justify-center gap-3 text-[15px] font-bold text-[#085848]">

          <img src="/Images/google.png" alt="Google logo" class="w-6 h-6">Continue with Google
        </button>

        <p id="google-message" class="mt-3 text-center text-sm text-red-500" role="status" aria-live="polite"></p>

        <p class="mt-8 text-center text-[12px] font-bold text-[#78909C]"> Don't have an account ?<a href="./signup.html" class="ml-1 text-[#056959] font-bold">Sign Up</a></p>
      </div>
    </section>
  </main>

  <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
