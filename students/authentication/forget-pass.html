<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPrep NG - Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./forget-pass.js" defer></script>
</head>

<body class="bg-white overflow-x-hidden font-[Inter]">

<main class="relative min-h-screen w-full overflow-hidden bg-white">


  <img src="/Images/Ellipse 247.png" alt="ellipse" class="absolute top-0 right-0">


  <img src="/Images/Ellipse 248.png" alt="ellipse" class="absolute bottom-0 left-0">


      <img src="/Images/logo 2.png" alt="ExamPrep NG logo" class="w-[250px] p-6">


  <section class="relative z-10 px-5 sm:px-8 flex justify-center">

    <div class="w-full md:max-w-[500px] text-center mt-12 sm:mt-14 md:mt-16">

      <img src="/Images/forget.png" alt="Reset password illustration" class="block m-auto">

      <h1 class="mt-4 text-[40px] md:text-[50px] leading-tight font-bold text-[#083830] md:whitespace-nowrap">
        Forgot your password?
      </h1>

      
      <p class="mt-4 text-[20px] leading-6 text-[#000000]/50 font-medium">
        No worries! Enter your email address and we will<br class="hidden sm:block">
        send you a link to reset your password.
      </p>



      <form id="forgot-password-form" class="mt-8">

        <div class="p-4 border border-[#D9D9D9] rounded-[7px] bg-white flex items-center gap-3">

          <ion-icon name="mail-outline" class="text-[20px] text-[#000000]/50"></ion-icon>

          <input id="email" type="email" placeholder="Enter your email address" required class="flex-1 outline-none bg-transparent text-[20px] text-[#003028] placeholder:text-[#000000]/50">
        </div>

        <p id="message" class="hidden mt-3 text-[16px] text-left"></p>

        <button type="submit" class="mt-7 w-full p-4 rounded-[8px] bg-[#085848] text-white flex items-center justify-center gap-3 text-[20px] font-bold">
          <p>Send Reset Link</p>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </button>

      </form>


  
      <p class="mt-7 text-[20px] text-[#000000]/50 mb-4">
        Remember your password?
        <a href="./login.html" class="font-semibold text-[#085848]">Log in
        </a>
      </p>
    </div>
  </section>
</main>

<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
