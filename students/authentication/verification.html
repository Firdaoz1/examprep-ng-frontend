<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPrep NG - Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./verification.js" defer></script>
</head>

<body class="bg-white overflow-x-hidden font-[Inter]">

<main class="relative min-h-screen w-full overflow-hidden bg-white">


  <img src="/Images/Ellipse 247.png" alt="ellipse" class="absolute top-0 right-0">


  <img src="/Images/Ellipse 248.png" alt="ellipse" class="absolute bottom-0 left-0">

      <img src="/Images/logo 2.png" alt="ExamPrep NG logo" class="w-[250px] p-6">

  <section class="relative z-10 px-5 sm:px-8 flex justify-center">

    <div class="w-full md:max-w-[500px] text-center mt-12 sm:mt-14 md:mt-16">

      <img src="/Images/verification.png" alt="Reset password illustration" class="block m-auto">

      <h1 class="mt-4 text-[40px] md:text-[54px] leading-tight font-bold text-[#083830] whitespace-nowrap">
        Congratulations!
      </h1>

      
      <p class="mt-2 md:mt-6 text-[30px] leading-6 text-[#085848] font-medium">
        Your email has been verified.
      </p>

      <p class="mt-4 md:mt-6 text-[20px] leading-6 text-[#000000]/50">Verification complete. You can now log in to your <br class="hidden sm:block">ExamPrep NG account.</p>

      <div id="verification-form" class="mt-5 md:mt-10 flex justify-center mb-4">

        <button type="submit" class="mt-7 w-full max-w-[250px] p-4 rounded-[8px] bg-[#085848] text-white flex items-center justify-center gap-3 text-[20px] font-bold">
          <p>Login</p>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </button>

      </div>

    </div>
  </section>
</main>

<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
