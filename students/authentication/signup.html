<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPrep NG - Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./signup.js" defer></script>
</head>

<body class="bg-[#181818] font-['Inter']">

  <main class="w-full max-w-[1280px] mx-auto bg-white md:h-[calc(100vh-32px)] lg:mt-4 lg:grid lg:grid-cols-2">

    <section class="bg-[#083830] text-[#FFFFFF] px-6 py-4 md:px-12 flex flex-col items-start">

        <img src="/Images/logo 4.png" alt="logo" class="mt-4">

      <div class="mt-8">
        <h1 class="text-[32px] lg:text-[31px] font-bold leading-10">Build your skills.<br><span class="text-[#319F43]">Achieve your goals.</span></h1>

        <p class=" mt-5 max-w-[310px] text-[16px] leading-7 tracking-[0.332px] text-white font-medium">Get access to past questions, CBT simulations and personalised learning to help you prepare for JAMB and other exams.</p>
      </div>
        <img src="/Images/Learning-rafiki 1.png" alt="person" class="mt-5 -ml-9">
    </section>

    <section class="bg-white px-6 py-8 md:px-14 flex items-center">

      <div class="w-full max-w-[500px] mx-auto">
        <div class="mb-10">
          <h2 class=" flex items-center gap-2 text-[28px] md:text-[32px] font-bold text-[#085848] mt-6">Create your account</h2>
          <p class="mt-2 text-[13px] md:text-[16px] font-bold text-[#78909C]">Start your journey to better results.</p>
        </div>

        <form id="signup-form" class="space-y-5">

             <p id="message" class="text-[12px] text-red-500"></p>

             
          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">

            <img src="/Images/name.png" alt="contact" class="w-5 h-5">

            <input type="text" placeholder="Full name" id="full-name" class="flex-1 border-none outline-none bg-transparent text-[16px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold">
          </div>

    
          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">

            <img src="/Images/email.png" alt="Email icon" class="w-5 h-5">

            <input type="email" placeholder="Email address" id="email" class="flex-1 border-none outline-none bg-transparent text-[16px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold">
          </div>

          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">

            <img src="/Images/Password.png" alt="Password-icon" class="w-5 h-5">

            <input id="password" type="password" placeholder="Password" class="flex-1 border-none outline-none bg-transparent text-[16px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold">

            <button type="button" class="toggle-password w-7 h-7 flex items-center justify-center">

              <ion-icon id="eye-icon" name="eye-off-outline" class="text-2xl text-[#085848]"></ion-icon>
            </button>
          </div>

           <p id="password-message" class="text-[12px] text-red-500"></p>

          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">

            <img src="/Images/Password.png" alt="Password-icon" class="w-5 h-5">

            <input id="confirm-password" type="password" placeholder="Confirm password" class="flex-1 border-none outline-none bg-transparent text-[16px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold">

            <button type="button" class="toggle-password w-7 h-7 flex items-center justify-center">

              <ion-icon id="eye-icon" name="eye-off-outline" class="text-2xl text-[#085848]"></ion-icon>
            </button>
          </div>

          <button type="submit" class="w-full p-3 mt-5 bg-[#085848] rounded-[9px] text-[#FFFFFF] text-[20px] font-bold flex items-center justify-center gap-3 transition">Sign Up <ion-icon name="arrow-forward-outline"></ion-icon>
          </button>
        </form>

        <button type="button" id="resend-verification" class="hidden w-full mt-4 p-3 rounded-[9px] bg-[#085848] text-white font-bold">
  Resend verification email
</button>

        <div class="my-10 flex items-center gap-5">

          <div class="h-px bg-[#78909C]/70 flex-1"></div>
          <span class="text-[11px] font-bold text-[#78909C]"> OR</span>

          <div class="h-px bg-[#78909C]/70 flex-1"></div>
        </div>

        <button id="google-login" type="button" class="w-full p-4 border border-[#D9D9D9] rounded-[10px] bg-white flex items-center justify-center gap-3 text-[15px] font-bold text-[#085848]">
  <img src="/Images/google.png" alt="Google logo" class="w-6 h-6">
  Continue with Google
</button>

<p id="google-message" class="mt-3 text-center text-sm text-red-500" role="status" aria-live="polite"></p>

        <p class="mt-8 text-center text-[12px] md:[15px] font-bold text-[#78909C]"> Alredy have an account?<a href="login.html" class="ml-1 text-[#085848] font-bold">Sign in</a></p>
      </div>
    </section>
  </main>

  <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
